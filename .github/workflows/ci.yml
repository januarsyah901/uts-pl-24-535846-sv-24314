name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  # Job 1: Pengujian Backend Laravel
  test-backend:
    name: Backend Test (PHP & Pest/PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Copy Environment Configuration
        run: |
          cd backend
          cp .env.example .env

      - name: Install Composer Dependencies
        run: |
          cd backend
          composer install --no-interaction --prefer-dist --no-progress

      - name: Generate Application Key
        run: |
          cd backend
          php artisan key:generate

      - name: Run Backend Tests
        run: |
          cd backend
          php artisan test

  # Job 2: Kompilasi Aset Frontend Vue 3
  build-frontend:
    name: Frontend Build (Vite & Vue 3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Vue Production Artifacts
        run: |
          cd frontend
          npm run build

  # Job 3: Continuous Deployment ke GitHub Container Registry (Hanya push ke branch main)
  deploy:
    name: Build & Push Docker Images (GHCR)
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Lowercase Repository Owner
        run: |
          echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image (FrankenPHP)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/uts-pl-backend:${{ github.sha }}

      - name: Build and Push Frontend Image (Vue Nginx)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/uts-pl-frontend:${{ github.sha }}
